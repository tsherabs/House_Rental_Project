apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: db
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: homefinder
            - name: POSTGRES_DB
              value: homefinder
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homefinder-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          startupProbe:
            exec:
              command: [pg_isready, -U, homefinder, -d, homefinder]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [pg_isready, -U, homefinder, -d, homefinder]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, homefinder, -d, homefinder]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
