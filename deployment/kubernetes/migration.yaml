apiVersion: batch/v1
kind: Job
metadata:
  name: __MIGRATION_JOB__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: migrate
          image: __API_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [node, src/db/migrate.js]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: homefinder-config
            - secretRef:
                name: homefinder-secrets
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
