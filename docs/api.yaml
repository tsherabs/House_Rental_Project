        '500':
          description: Unexpected error; no sensitive details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
  /auth/me:
    get:
      operationId: currentUser
      summary: Load current user role and account status
      security:
