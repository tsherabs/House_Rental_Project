  /properties/{id}/images:
    post:
      operationId: uploadImages
      summary: Landlord uploads property photos
      description: >-
        JPEG/PNG/WebP only; actual content is decoded and re-encoded, stripping metadata. 5 MiB/file, 8 images
        total, 25 megapixels decoded, no animation. Transactional property lock enforces concurrent count
        limits. Returns the full canonical image list.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Origin
          in: header
          required: false
          description: >-
            Required on mutations unless a Referer with APP_ORIGIN is supplied. Exact match with configured
            APP_ORIGIN. Missing or foreign origin returns 403.
          schema:
            type: string
            format: uri
            examples:
