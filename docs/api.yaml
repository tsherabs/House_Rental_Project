        - reviewStatus
        - reviewedBy
        - reviewReason
        - reviewedAt
        - createdAt
        - propertyTitle
        - visibilityStatus
    ViewingPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Viewing'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination
    FavouritePage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SavedProperty'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
