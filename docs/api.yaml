          required: false
          description: Exact APP_ORIGIN required unless same-origin Referer is supplied.
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyEnvelope'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, suspended account or CSRF origin rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource absent, unavailable or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid lifecycle transition or duplicate pending report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                visibilityStatus:
                  type: string
                  enum:
                    - hidden
                    - published
                reason:
                  type: string
                  minLength: 10
                  maxLength: 1000
              required:
                - visibilityStatus
                - reason
  /properties/{id}/confirm:
    post:
      operationId: confirmListing
      summary: 'Owning landlord: renew 30 days; preserve rental and moderation state, reject archived'
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Origin
          in: header
          required: false
          description: Exact APP_ORIGIN required unless same-origin Referer is supplied.
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyEnvelope'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, suspended account or CSRF origin rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource absent, unavailable or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid lifecycle transition or duplicate pending report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
              required: []
  /my/properties/expiring:
    get:
      operationId: expiringListings
      summary: 'Landlord: nonarchived owned listings with null expiry, expired, or expiring within 7 days'
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyPage'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, suspended account or CSRF origin rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource absent, unavailable or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid lifecycle transition or duplicate pending report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: homefinder.sid
      description: Default SESSION_COOKIE_NAME; opaque server-side PostgreSQL session. Configure clients if renamed.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                  message:
                    type: string
                required:
                  - field
                  - message
          required:
            - code
            - message
      required:
        - error
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and normalized to lowercase.
        role:
          type: string
          enum:
            - seeker
            - landlord
            - admin
        accountStatus:
          type: string
          enum:
            - active
            - suspended
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - accountStatus
        - createdAt
    UserEnvelope:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
        - user
    Register:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and normalized to lowercase.
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: 12 or more characters and at most 72 UTF-8 bytes. Never trimmed.
        role:
          type: string
          enum:
            - seeker
            - landlord
      required:
        - name
        - email
        - password
        - role
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and normalized to lowercase.
        password:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: At most 72 UTF-8 bytes.
      required:
        - email
        - password
    Pagination:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - limit
        - total
        - totalPages
    Image:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          examples:
            - /api/v1/property-images/00000000-0000-4000-8000-000000000001
        displayOrder:
          type: integer
          minimum: 0
      required:
        - id
        - url
        - displayOrder
    ImagesEnvelope:
      type: object
      additionalProperties: false
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          maxItems: 8
      required:
        - images
    PropertyCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 160
        description:
          type: string
          minLength: 20
          maxLength: 5000
        monthlyRent:
          type: string
          pattern: ^(0|[1-9]\d{0,9})(\.\d{1,2})?$
          examples:
            - '18000.00'
        deposit:
          type: string
          pattern: ^(0|[1-9]\d{0,9})(\.\d{1,2})?$
          examples:
            - '18000.00'
        bedrooms:
          type: integer
          minimum: 0
          maximum: 20
        neighbourhood:
          type: string
          minLength: 2
          maxLength: 100
        landmarks:
          anyOf:
            - type: string
              maxLength: 500
            - type: 'null'
        waterAvailable:
          type: boolean
        parkingAvailable:
          type: boolean
        moveInDate:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      required:
        - title
        - description
        - monthlyRent
        - deposit
        - bedrooms
        - neighbourhood
        - waterAvailable
        - parkingAvailable
        - moveInDate
    PropertyPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 160
        description:
          type: string
          minLength: 20
          maxLength: 5000
        monthlyRent:
          type: string
          pattern: ^(0|[1-9]\d{0,9})(\.\d{1,2})?$
          examples:
            - '18000.00'
        deposit:
          type: string
          pattern: ^(0|[1-9]\d{0,9})(\.\d{1,2})?$
          examples:
            - '18000.00'
        bedrooms:
          type: integer
          minimum: 0
          maximum: 20
        neighbourhood:
          type: string
          minLength: 2
          maxLength: 100
        landmarks:
          anyOf:
            - type: string
              maxLength: 500
            - type: 'null'
        waterAvailable:
          type: boolean
        parkingAvailable:
          type: boolean
        moveInDate:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
      required: []
      minProperties: 1
    Property:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 5
          maxLength: 160
        description:
          type: string
          minLength: 20
          maxLength: 5000
        monthlyRent:
          type: string
          pattern: ^(0|[1-9]\d{0,9})\.\d{2}$
          examples:
            - '18000.00'
        deposit:
          type: string
          pattern: ^(0|[1-9]\d{0,9})\.\d{2}$
          examples:
            - '18000.00'
        bedrooms:
          type: integer
          minimum: 0
          maximum: 20
        neighbourhood:
          type: string
          minLength: 2
          maxLength: 100
        landmarks:
          anyOf:
            - type: string
              maxLength: 500
            - type: 'null'
        waterAvailable:
          type: boolean
        parkingAvailable:
          type: boolean
        moveInDate:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        availabilityStatus:
          type: string
          enum:
            - available
            - rented
        visibilityStatus:
          type: string
          enum:
            - draft
            - published
            - hidden
            - archived
        confirmedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          maxItems: 8
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - ownerId
        - title
        - description
        - monthlyRent
        - deposit
        - bedrooms
        - neighbourhood
        - landmarks
        - waterAvailable
        - parkingAvailable
        - moveInDate
        - availabilityStatus
        - visibilityStatus
        - confirmedAt
        - expiresAt
        - images
        - createdAt
        - updatedAt
    PropertyEnvelope:
      type: object
      additionalProperties: false
      properties:
        property:
          $ref: '#/components/schemas/Property'
      required:
        - property
    PropertyPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination
    UserPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination
    Availability:
      type: object
      additionalProperties: false
      properties:
        availabilityStatus:
          type: string
          enum:
            - available
            - rented
      required:
        - availabilityStatus
    ImageOrder:
      type: object
      additionalProperties: false
      properties:
        imageIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Exact current owned image set, including an empty array when no images exist.
      required:
        - imageIds
    AccountStatus:
      type: object
      additionalProperties: false
      properties:
        accountStatus:
          type: string
          enum:
            - active
            - suspended
        reason:
          type: string
          minLength: 10
          maxLength: 1000
      required:
        - accountStatus
        - reason
    Viewing:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        propertyTitle:
          type: string
        seekerId:
          type: string
          format: uuid
        proposedAt:
          type: string
          format: date-time
        message:
          anyOf:
            - type: string
              maxLength: 1000
            - type: 'null'
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
            - cancelled
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - propertyId
        - propertyTitle
        - seekerId
        - proposedAt
        - message
        - status
        - createdAt
        - updatedAt
    ViewingHistory:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        viewingId:
          type: string
          format: uuid
        oldStatus:
          anyOf:
            - type: string
              enum:
                - pending
                - accepted
                - rejected
                - cancelled
            - type: 'null'
        newStatus:
          type: string
          enum:
            - pending
            - accepted
            - rejected
            - cancelled
        changedBy:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time
      required:
        - id
        - viewingId
        - oldStatus
        - newStatus
        - changedBy
        - changedAt
    ViewingCreate:
      type: object
      additionalProperties: false
      properties:
        propertyId:
          type: string
          format: uuid
        proposedAt:
          type: string
          format: date-time
          description: Future instant with Z or explicit UTC offset
        message:
          type: string
          maxLength: 1000
      required:
        - propertyId
        - proposedAt
    ViewingEnvelope:
      type: object
      additionalProperties: false
      properties:
        viewing:
          $ref: '#/components/schemas/Viewing'
      required:
        - viewing
    ViewingDetail:
      type: object
      additionalProperties: false
      properties:
        viewing:
          $ref: '#/components/schemas/Viewing'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ViewingHistory'
      required:
        - viewing
        - history
    Favourite:
      type: object
      additionalProperties: false
      properties:
        propertyId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
        - propertyId
        - createdAt
    SavedProperty:
      type: object
      additionalProperties: false
      properties:
        propertyId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        available:
          type: boolean
        property:
          anyOf:
            - $ref: '#/components/schemas/Property'
            - type: 'null'
      required:
        - propertyId
        - createdAt
        - available
        - property
    FavouriteEnvelope:
      type: object
      additionalProperties: false
      properties:
        favourite:
          $ref: '#/components/schemas/Favourite'
      required:
        - favourite
    Report:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 10
          maxLength: 1000
        reviewStatus:
          type: string
          enum:
            - pending
            - dismissed
            - actioned
        reviewedBy:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        reviewReason:
          anyOf:
            - type: string
              minLength: 10
              maxLength: 1000
            - type: 'null'
        reviewedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - propertyId
        - reporterId
        - reason
        - reviewStatus
        - reviewedBy
        - reviewReason
        - reviewedAt
        - createdAt
    ReportEnvelope:
      type: object
      additionalProperties: false
      properties:
        report:
          $ref: '#/components/schemas/Report'
      required:
        - report
    AdminReport:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 10
          maxLength: 1000
        reviewStatus:
          type: string
          enum:
            - pending
            - dismissed
            - actioned
        reviewedBy:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        reviewReason:
          anyOf:
            - type: string
