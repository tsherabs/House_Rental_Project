openapi: 3.1.0
info:
  title: Thimphu HomeFinder API
  version: 1.0.0
  description: >-
    M3 contract based on the team-approved baseline confirmed 20 October 2026. Authentication, properties,
    images and account administration. M4 workflows follow the implementation proposal in ADR 0002; team review is pending. All JSON mutations reject
    unknown fields. Same-origin CSRF checks apply to unsafe requests. Money is decimal text; instants are UTC
    ISO-8601; move-in dates are date-only.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      summary: API liveness
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    const: ok
                    type: string
                required:
                  - status
        '500':
          description: Unexpected error; no sensitive details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      operationId: register
      summary: Register seeker or landlord; does not log in
      security: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: >-
            Required on mutations unless a Referer with APP_ORIGIN is supplied. Exact match with configured
            APP_ORIGIN. Missing or foreign origin returns 403.
          schema:
            type: string
            format: uri
            examples:
              - http://localhost:4200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role forbidden, account suspended, revoked session or invalid CSRF origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict with current resource state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request or image too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error; no sensitive details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate and rotate session ID
      security: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: >-
            Required on mutations unless a Referer with APP_ORIGIN is supplied. Exact match with configured
            APP_ORIGIN. Missing or foreign origin returns 403.
          schema:
            type: string
            format: uri
            examples:
              - http://localhost:4200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
          headers:
            Set-Cookie:
              description: Opaque session cookie; HttpOnly, SameSite=Lax, Secure in production.
              schema:
                type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role forbidden, account suspended, revoked session or invalid CSRF origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request or image too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error; no sensitive details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Destroy session and clear cookie
      security:
        - sessionCookie: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: >-
            Required on mutations unless a Referer with APP_ORIGIN is supplied. Exact match with configured
            APP_ORIGIN. Missing or foreign origin returns 403.
          schema:
            type: string
            format: uri
            examples:
              - http://localhost:4200
      responses:
        '204':
          description: Completed; no response body
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role forbidden, account suspended, revoked session or invalid CSRF origin
