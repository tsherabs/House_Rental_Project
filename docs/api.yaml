          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Image media type or decoded content not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error; no sensitive details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: string
                    format: binary
              required:
                - images
            encoding:
              images:
                contentType: image/jpeg, image/png, image/webp
