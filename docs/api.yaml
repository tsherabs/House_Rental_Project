        '500':
          description: Unexpected error; no sensitive details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /properties:
    get:
      operationId: searchProperties
      summary: Browse public available properties
      description: >-
        Filters combine with AND. minRent <= maxRent. Literal case-insensitive neighbourhood substring;
        percent/underscore are not wildcards. availableFrom selects moveInDate <= that date. Published,
        available, nonexpired listings with active owners only. Null expiresAt means no expiry assigned.
        Unknown query fields are rejected.
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - name: minRent
          in: query
          required: false
          schema:
            type: string
            pattern: ^(0|[1-9]\d{0,9})(\.\d{1,2})?$
            examples:
              - '18000.00'
        - name: maxRent
          in: query
          required: false
          schema:
            type: string
            pattern: ^(0|[1-9]\d{0,9})(\.\d{1,2})?$
            examples:
              - '18000.00'
        - name: bedrooms
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 20
        - name: neighbourhood
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: waterAvailable
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: parkingAvailable
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: availableFrom
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - recent
              - rent_asc
              - rent_desc
            default: recent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyPage'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error; no sensitive details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProperty
      summary: Landlord creates own property
      description: >-
        Owner comes from session; starts published and available. No confirmation or expiry is assigned. Valid
        past move-in dates are accepted.
      security:
        - sessionCookie: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: >-
            Required on mutations unless a Referer with APP_ORIGIN is supplied. Exact match with configured
            APP_ORIGIN. Missing or foreign origin returns 403.
          schema:
            type: string
            format: uri
            examples:
              - http://localhost:4200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreate'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
