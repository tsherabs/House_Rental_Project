        '500':
          description: Unexpected error; no sensitive details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: archiveProperty
      summary: Landlord soft archives own property
      description: >-
        Preserves rows and references. Repeated archive succeeds. Archived properties remain accessible in
        owner management.
      security:
