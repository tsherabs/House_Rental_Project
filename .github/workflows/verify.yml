name: House Rental CI + Docker Publish

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: homefinder
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: homefinder_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U homefinder -d homefinder_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://homefinder:ci-test-only@localhost:5432/homefinder_test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Backend lint, API contract, and tests
        run: npm run lint && npm run check:api && npm test
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests and production build
        run: npm test -- --watch=false && npm run build
        working-directory: frontend

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t house-rental-api:ci .

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t house-rental-web:ci .

  publish:
    name: Publish tested images to GHCR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Lowercase GHCR image namespace
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-api:sha-${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Publish frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-web:sha-${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
